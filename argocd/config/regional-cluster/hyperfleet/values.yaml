seaplane:
  applicationName: seaplane-operator

  namespace: argocd

  targetNamespace: seaplane

  project: default

  source:
    # TESTING (ROSAENG-1085): chart from the rosa-seaplane-api#701 PR branch so
    # CRDs/chart match the on-PR operator image below. Revert before merge.
    repoURL: https://github.com/typeid/rosa-seaplane-api.git
    targetRevision: 3df4546faad5bd3f9e8f704c6e563a338661ff72
    path: seaplane-operator/charts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  helmValues:
    image:
      repository: quay.io/redhat-user-workloads/rosa-tenant/rosa-seaplane-operator
      tag: "on-pr-3df4546faad5bd3f9e8f704c6e563a338661ff72@sha256:cc3f47426bffa6c3cd9d846883e24620fe4e2235697af169198d449320bc1597"
      pullPolicy: Always

    replicaCount: 2

    serviceAccount:
      create: true
      name: seaplane-operator
      annotations: {}

    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

