deployment_name: '{{ aws_region }}{% if eph_prefix %}-{{ eph_prefix }}{% endif %}'
aws:
  zoa_access_trusted_assumer_role_names:
  - OrganizationAccountAccessRole
  - ci
  zoa_access_trusted_assumer_role_name_suffixes:
  - rosa-seaplane-zoa-operator-dev
dns:
  domain: '{% if ci %}ci00{% else %}dev0{% endif %}.rosa.devshift.net'
worker_node_ami:
  family: AL2023
  id: ami-056d5e72aa5cf51f1
regional_cluster:
  enable_bastion: true
  enable_write_sre_tools: true
  node_instance_families:
  - m8i-flex
  - m7i-flex
  seaplane_db_instance_class: db.t4g.medium
  seaplane_db_deletion_protection: false
  seaplane_db_skip_final_snapshot: true
  seaplane_db_performance_insights_enabled: false
  seaplane_db_monitoring_interval: 0
  enable_sre_tools_gateway: true
  enable_sre_public_access: false
  zoa_lambda_api_concurrency: -1
  zoa_lambda_worker_concurrency: -1
  zoa_lambda_access_concurrency: -1
  zoa_lambda_image_tag: f8fb152
  zoa_runner_image_tag: f8fb152
  zoa_boundary_image_tag: f8fb152
applications:
  regional-cluster:
    seaplane:
      oidcS3Bucket: hypershift-{{ eph_prefix }}-regional-oidc-{{ account_id }}
    platformApi:
      authz:
        config: "formatVersion: 1\nregisteredAccounts: [\"599476212575\", \"114594328247\"\
          ]\npolicies:\n  - id: read-clusters-599476212575\n    ownerAccountID: \"\
          599476212575\"\n    content: |\n      permit(principal, action in Seaplane::Action::\"\
          AllActions\", resource)\n      when { context.accountId == \"599476212575\"\
          \ && context.region == \"us-east-1\" }\n      unless { context.requestLabels.hasTag(\"\
          authz-deny-probe\") };\n  - id: read-clusters-114594328247\n    ownerAccountID:\
          \ \"114594328247\"\n    content: |\n      permit(principal, action in Seaplane::Action::\"\
          AllActions\", resource)\n      when { context.accountId == \"114594328247\"\
          \ && context.region == \"us-east-1\" }\n      unless { context.requestLabels.hasTag(\"\
          authz-deny-probe\") };\nattachments:\n  - id: dev-readers-599476212575\n\
          \    policyID: read-clusters-599476212575\n    principalARN: arn:aws:iam::599476212575:role/{{\
          \ aws.child_admin_role_name }}\n    scope: regional\n    region: us-east-1\n\
          \  - id: dev-readers-114594328247\n    policyID: read-clusters-114594328247\n\
          \    principalARN: arn:aws:iam::114594328247:role/{{ aws.child_admin_role_name\
          \ }}\n    scope: regional\n    region: us-east-1\n"
management_cluster_defaults:
  enable_bastion: true
  node_instance_families:
  - m8i-flex
  - m7i-flex
observability:
  pagerduty:
    enabled: false
